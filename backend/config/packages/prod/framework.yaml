parameters:
    env(TRUSTED_PROXIES): '127.0.0.1,10.42.0.0/16'

framework:
    session:
        handler_id: '%env(REDIS_SESSION_URL)%'

        # sa fonctionne grace a lapi publique en https
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax

        # 24 h
        gc_maxlifetime: 86400
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers:
        - x-forwarded-for
        - x-forwarded-host
        - x-forwarded-proto
        - x-forwarded-port
