# ========================================================
# INITIALISATION ET EQUIPES (PREMIER LEAGUE)
# ========================================================
App\Entity\Team:
  team_pl_{0..19}:
    name: '<competitionTeamData("name", "PL")>'
    country: '<competitionTeamData("country", "PL")>'
    logoUrl: '<competitionTeamData("logoUrl", "PL")>'
    league: "Premier League"
    transferBudget: "<numberBetween(30000000, 500000000)>"
    verificationStatus: !php/enum App\Enum\TeamVerificationStatusEnum::VERIFIED
    # La ligne 'club' a été supprimée d'ici car elle n'existe pas dans l'entité Team !

# ========================================================
# CLUBS (PREMIER LEAGUE)
# ========================================================
App\Entity\Club:
  club_pl_{0..19}:

# ========================================================
# JOUEURS (PREMIER LEAGUE)
# ========================================================
App\Entity\Player:
  player_pl_{0..585}:
    firstName: '<competitionPlayerData("firstName", "PL")>'
    lastName: '<competitionPlayerData("lastName", "PL")>'
    photoUrl: '<imageUrl(200, 200, "sports")>'
    birthDate: '<dateTimeBetween("<competitionPlayerData("birthDate", "PL")>", "<competitionPlayerData("birthDate", "PL")>")>'
    nationality: '<competitionPlayerData("nationality", "PL")>'
    position: '<competitionPlayerData("position", "PL")>'
    heightCm: "<numberBetween(170, 195)>"
    weightKg: "<numberBetween(65, 90)>"
    preferredFoot: '<randomElement(["Droitier", "Gaucher"])>'
    marketValue: "<numberBetween(5000000, 120000000)>"
    weeklySalary: "<numberBetween(35000, 450000)>"
    releaseClause: "<numberBetween(15000000, 250000000)>"
    contractStatus: !php/enum App\Enum\PlayerContractStatusEnum::UNDER_CONTRACT
    contractEndDate: '<dateTimeBetween("+1 year", "+4 years")>'
    joinedAt: '<dateTimeBetween("-3 years", "-1 year")>'
    marketStatus: !php/enum App\Enum\PlayerMarketStatusEnum::NOT_LISTED
    availabilityStatus: !php/enum App\Enum\PlayerAvailabilityStatusEnum::NORMAL
    
    # C'est bien ici, au niveau du Player, que tu fais les deux liaisons !
    team: '@team_pl_<competitionPlayerData("associatedTeamIndex", "PL")>'
    club: '@club_pl_<competitionPlayerData("associatedClubIndex", "PL")>'