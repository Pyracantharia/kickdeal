# ========================================================
# 1. GENERATION DE TOUS LES CLUBS ET EQUIPES DE LIGUE 1
# ========================================================
App\Entity\Club:
  club_{0..17}:
    # Crée automatiquement 18 entités Club (club_0 à club_17)

App\Entity\Team:
  team_{0..17}:
    name: '<ligue1TeamData("name")>'
    country: '<ligue1TeamData("country")>'
    logoUrl: '<ligue1TeamData("logoUrl")>'
    league: "Ligue 1"
    transferBudget: "<numberBetween(10000000, 200000000)>"
    verificationStatus: !php/enum App\Enum\TeamVerificationStatusEnum::VERIFIED

# ========================================================
# 2. TOUS LES JOUEURS DES EQUIPES LIGUE 1
# ========================================================
App\Entity\Player:
  player_{0..600}:
    firstName: '<teamSquadData("firstName")>'
    lastName: '<teamSquadData("lastName")>'
    photoUrl: '<imageUrl(200, 200, "sports")>'
    birthDate: '<teamSquadData("birthDate")>'
    nationality: '<teamSquadData("nationality")>'
    position: '<teamSquadData("position")>'
    heightCm: "<numberBetween(172, 190)>"
    weightKg: "<numberBetween(68, 85)>"
    preferredFoot: '<randomElement(["Droitier", "Gaucher"])>'
    marketValue: "<numberBetween(15000000, 60000000)>"
    weeklySalary: "<numberBetween(40000, 250000)>"
    releaseClause: "<numberBetween(40000000, 120000000)>"
    contractStatus: !php/enum App\Enum\PlayerContractStatusEnum::UNDER_CONTRACT
    contractEndDate: '<dateTimeBetween("+1 year", "+4 years")>'
    joinedAt: '<dateTimeBetween("-3 years", "-1 year")>'
    marketStatus: !php/enum App\Enum\PlayerMarketStatusEnum::NOT_LISTED
    availabilityStatus: !php/enum App\Enum\PlayerAvailabilityStatusEnum::NORMAL
    team: "@team_<playerTeamIndex()>"
    club: "@club_<playerClubIndex()>"

# ========================================================
# 3. REMPLISSAGE DE LA SHORTLIST (TRANSFER TARGETS)
# ========================================================
App\Entity\TransferTarget:
  target_0:
    team: "@team_0"
    player: "@player_0"
  target_1:
    team: "@team_0"
    player: "@player_1"
  target_2:
    team: "@team_0"
    player: "@player_2"
  target_3:
    team: "@team_0"
    player: "@player_3"
  target_4:
    team: "@team_0"
    player: "@player_4"
