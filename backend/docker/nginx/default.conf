server {
    listen 8080;
    server_name ${NGINX_SERVER_NAME};
    client_max_body_size 20M;
    #20-envsubst-on-templates.sh utilise les variables d'environnement pour remplacer les placeholders dans les fichiers de configuration.

    # On définit le resolver DNS interne de Docker.
    # C'est la clé pour que Nginx puisse trouver les autres services.
    resolver 127.0.0.11 valid=30s;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        # # Si la requête est de type OPTIONS
        # if ($request_method = 'OPTIONS') {
        #     # On ajoute les en-têtes CORS nécessaires
        #     add_header 'Access-Control-Allow-Origin' 'http://localhost:3000';
        #     add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        #     add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, DNT, User-Agent, X-Requested-With';
        #     add_header 'Access-Control-Max-Age' 86400;
            
        #     # On renvoie une réponse 204 "No Content", c'est la norme pour un preflight réussi
        #     return 204;
        # }
        
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # On utilise une variable pour le nom du service.
        # Cela force Nginx à utiliser le resolver et à être plus patient.
        set $fastcgi_pass backend:9000;
        fastcgi_pass $fastcgi_pass;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # internal; # Commenté pour le débogage si nécessaire
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
