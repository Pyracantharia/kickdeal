services:
  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/var/www/html
      - /app/vendor
      - ./backend/docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      CHILIZ_RPC_URL: "${CHILIZ_RPC_URL}"
      CHILIZ_CHAIN_ID: "${CHILIZ_CHAIN_ID}"
      CHILIZ_RECEIVER_ADDRESS: "${CHILIZ_RECEIVER_ADDRESS}"
      CHZ_EUR_RATE: "${CHZ_EUR_RATE}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      STRIPE_PRICE_AGENT_PRO: "${STRIPE_PRICE_AGENT_PRO}"
      STRIPE_PRICE_CLUB_PRO: "${STRIPE_PRICE_CLUB_PRO}"
      STRIPE_PRICE_CLUB_ENTERPRISE: "${STRIPE_PRICE_CLUB_ENTERPRISE}"
    depends_on:
      - db
    networks:
      - myapp_network

  nginx:
    image: nginx:1.23-alpine
    container_name: nginx
    ports:
      - "8000:8080" # On accède à l'API via http://localhost:8000
    volumes:
      - ./backend:/var/www/html # Partage le même code source
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - myapp_network

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000" # On accède au site via http://localhost:3000
    volumes:
      - ./frontend-app:/app # Monte le code source pour le live-reload
      - /app/node_modules # S'assure que node_modules n'est pas écrasé
    env_file:
      - ./frontend-app/.env.local
    environment:
      NEXT_PUBLIC_CHILIZ_CHAIN_ID: "${NEXT_PUBLIC_CHILIZ_CHAIN_ID}"
      NEXT_PUBLIC_CHILIZ_RPC_URL: "${NEXT_PUBLIC_CHILIZ_RPC_URL}"
      NEXT_PUBLIC_CHILIZ_RECEIVER_ADDRESS: "${NEXT_PUBLIC_CHILIZ_RECEIVER_ADDRESS}"
      NEXT_PUBLIC_CHZ_EUR_RATE: "${NEXT_PUBLIC_CHZ_EUR_RATE}"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${STRIPE_KEY}"
    networks:
      - myapp_network
  
  frontend-landing:
    build:
      context: ./frontend-landing
      dockerfile: Dockerfile
    container_name: frontend-landing
    ports:
      - "3001:3000" # On accède au site via http://localhost:3001
    volumes:
      - ./frontend-landing:/app # Monte le code source pour le live-reload
      - /app/node_modules # S'assure que node_modules n'est pas écrasé
    networks:
      - myapp_network
  
  ###> symfony/mailer ###
  mailer:
    container_name: mailer
    image: axllent/mailpit
    ports:
      - "1025"
      - "8081:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - myapp_network
###< symfony/mailer ###

  # === Service Base de Données PostgreSQL ===
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Changez ce mot de passe !
    ports:
      - "5432:5432" # Permet de se connecter à la DB depuis l'extérieur (ex: DBeaver)
    volumes:
      - db_data:/var/lib/postgresql/data # Persistance des données
    networks:
      - myapp_network

# Définition du réseau partagé
networks:
  myapp_network:
    driver: bridge

# Définition du volume nommé pour la persistance
volumes:
  db_data:
