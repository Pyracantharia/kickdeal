services:
  backend:
    image: kickdeal-backend:latest
    env_file: .env
    volumes:
      - ./backend:/var/www/html
      - /app/vendor
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    networks:
      - myapp_network

  nginx:
    image: nginx:1.23-alpine
    environment:
      NGINX_SERVER_NAME: ${TRAEFIK_DOMAIN}
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - myapp_network
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${TRAEFIK_DOMAIN}`)"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=websecure"
        - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
        - "traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_web"

  frontend:
    image: kickdeal-frontend:latest
    environment:
      NUXT_SERVER_BACKEND_URL: "http://nginx:80"
      NUXT_CLIENT_BACKEND_URL: "https://${TRAEFIK_DOMAIN}"
    networks:
      - myapp_network
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${TRAEFIK_FRONTEND_ROUTER_NAME}.rule=Host(`${TRAEFIK_FRONTEND_DOMAIN}`)"
        - "traefik.http.routers.${TRAEFIK_FRONTEND_ROUTER_NAME}.entrypoints=websecure"
        - "traefik.http.routers.${TRAEFIK_FRONTEND_ROUTER_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
        - "traefik.http.services.${TRAEFIK_FRONTEND_ROUTER_NAME}.loadbalancer.server.port=3000"
        - "traefik.docker.network=traefik_web"


  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - myapp_network
      
  wireguard:
    image: linuxserver/wireguard
    env_file: .env
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000 
      - PGID=1000
      - TZ=Europe/Paris # Votre fuseau horaire
      - PEERS=1 # psk flemme dutiliser le mode client
    volumes:
      - ./wireguard-config:/config # Pour la configuration de WireGuard
      - /lib/modules:/lib/modules # Nécessaire pour le module kernel
    ports:
      - target: 51820
        published: ${WIREGUARD_EXTERNAL_PORT} # Port externe, lu depuis .env
        protocol: udp
        mode: host
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

networks:
  myapp_network:
    driver: overlay
    attachable: true
  web:
    external: true
    name: traefik_web

volumes:
  db_data:
  backups_volume: 